{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /webhook/graph
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: http
          - path: /webhook/slack
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: http
{{- end }}
